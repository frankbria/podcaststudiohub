name: "Repo Maintainer: Implementation Loop"

on:
  # schedule:
  #   # Build mode: every 4 hours. Switch cron in config.yml, then update here.
  #   - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      force_issue:
        description: "Force implement a specific issue number (bypasses selection)"
        required: false
        type: number
      dry_run:
        description: "Dry run — select issue but don't implement"
        required: false
        type: boolean
        default: false

concurrency:
  group: repo-maintainer
  cancel-in-progress: false

env:
  CONFIG_PATH: .github/repo-maintainer/config.yml
  STATE_PATH: .github/repo-maintainer/state.json
  SCRIPTS_PATH: scripts/repo-maintainer

jobs:
  # ── Job 1: Circuit Breaker Check ──────────────────
  circuit-breaker:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      mode: ${{ steps.check.outputs.mode }}
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Check circuit breakers
        id: check
        run: |
          RESULT=$(bash ${{ env.SCRIPTS_PATH }}/check-circuit-breakers.sh 2>&1) || true
          echo "result=$RESULT"
          SHOULD_RUN=$(echo "$RESULT" | jq -r '.should_run // false')
          MODE=$(echo "$RESULT" | jq -r '.mode // "maintain"')
          REASON=$(echo "$RESULT" | jq -r '.reason // "unknown"')
          echo "should_run=$SHOULD_RUN" >> $GITHUB_OUTPUT
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "reason=$REASON" >> $GITHUB_OUTPUT
          if [[ "$SHOULD_RUN" != "true" ]]; then
            echo "::notice::Circuit breaker tripped: $REASON"
          fi

  # ── Job 2: Select Issue ───────────────────────────
  select-issue:
    needs: circuit-breaker
    if: needs.circuit-breaker.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.select.outputs.issue_number }}
      tier: ${{ steps.select.outputs.tier }}
      title: ${{ steps.select.outputs.title }}
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Select next issue
        id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_ISSUE: ${{ inputs.force_issue }}
        run: |
          if [[ -n "$FORCE_ISSUE" ]]; then
            RESULT=$(bash "$SCRIPTS_PATH/select-next-issue.sh" "$FORCE_ISSUE")
          else
            RESULT=$(bash "$SCRIPTS_PATH/select-next-issue.sh")
          fi
          echo "result=$RESULT"
          ISSUE=$(echo "$RESULT" | jq -r '.issue_number // empty')
          TIER=$(echo "$RESULT" | jq -r '.tier // "T1"')
          TITLE=$(echo "$RESULT" | jq -r '.title // ""')
          if [[ -z "$ISSUE" || "$ISSUE" == "null" ]]; then
            REASON=$(echo "$RESULT" | jq -r '.reason // "No eligible issues found"')
            echo "::notice::Idle: $REASON"
            echo "issue_number=" >> $GITHUB_OUTPUT
          else
            echo "issue_number=$ISSUE" >> $GITHUB_OUTPUT
            echo "tier=$TIER" >> $GITHUB_OUTPUT
            echo "title=$TITLE" >> $GITHUB_OUTPUT
            echo "::notice::Selected issue #$ISSUE ($TIER): $TITLE"
          fi

  # ── Job 3: Implement ──────────────────────────────
  implement:
    needs: [circuit-breaker, select-issue]
    if: |
      needs.select-issue.outputs.issue_number != '' &&
      inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    outputs:
      pr_number: ${{ steps.get-pr.outputs.pr_number }}
      result: ${{ steps.get-pr.outputs.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Read implementation prompt
        id: prompt
        env:
          MODE: ${{ needs.circuit-breaker.outputs.mode }}
          TIER: ${{ needs.select-issue.outputs.tier }}
          # Untrusted (user-controlled issue title) — read from env, never interpolated into the shell.
          TITLE: ${{ needs.select-issue.outputs.title }}
        run: |
          # Resolve mode-specific limits
          MAX_LINES=$(yq -r ".limits.${MODE}.max_lines_per_pr // 500" "$CONFIG_PATH" 2>/dev/null || echo 500)
          MAX_FILES=$(yq -r ".limits.${MODE}.max_files_per_pr // 15" "$CONFIG_PATH" 2>/dev/null || echo 15)

          # Determine PR type based on tier
          case "$TIER" in
            T0) PR_TYPE="auto-merge" ;;
            T1) PR_TYPE="normal" ;;
            T2|T3) PR_TYPE="draft" ;;
            *) PR_TYPE="normal" ;;
          esac

          # Create slug from issue title
          SLUG=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | head -c 40 | sed 's/-$//')

          echo "max_lines=$MAX_LINES" >> "$GITHUB_OUTPUT"
          echo "max_files=$MAX_FILES" >> "$GITHUB_OUTPUT"
          echo "pr_type=$PR_TYPE" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Implementation
        id: claude
        uses: anthropics/claude-code-action@536f2c32a39763739000b0e1ac69ca2647d97ce9 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude[bot],github-actions[bot]"
          prompt: |
            You are the Repo Maintainer agent implementing issue #${{ needs.select-issue.outputs.issue_number }}.

            ## Instructions
            1. Read the issue: `gh issue view ${{ needs.select-issue.outputs.issue_number }}`
            2. Check issue comments for an implementation plan
            3. Read CLAUDE.md for project conventions
            4. Explore the codebase to understand existing patterns

            ## Implementation
            - Follow TDD: write tests first, then implement
            - Follow existing code patterns
            - Keep changes under ${{ steps.prompt.outputs.max_lines }} lines and ${{ steps.prompt.outputs.max_files }} files
            - Create branch: `maintainer/issue-${{ needs.select-issue.outputs.issue_number }}-${{ steps.prompt.outputs.slug }}`

            ## MANDATORY: Pre-PR Verification
            Before creating the PR, you MUST run and pass these checks:

            If you changed Python files (apps/api/):
            ```bash
            cd apps/api && uv run pytest tests/ -x --tb=short
            cd apps/api && uv run ruff check src/ tests/
            ```

            If you changed TypeScript/frontend files (apps/web/):
            ```bash
            cd apps/web && npm test -- --passWithNoTests --watchAll=false
            cd apps/web && npm run lint
            cd apps/web && npm run build
            ```

            If tests fail, fix them before creating the PR. You have 2 attempts.
            Do NOT create a PR with failing tests.

            ## CI Verification Context
            After your PR is created, the review workflow will verify:
            - Backend-only PRs: pytest + ruff (no E2E)
            - Frontend PRs: jest + lint + build + health checks + Playwright E2E
            - Full-stack PRs: all of the above

            E2E tests start both API (port 8200) and frontend (port 3200) servers,
            then run Playwright against them. If your PR is backend-only, E2E is skipped.

            ## PR Creation
            Create a ${{ steps.prompt.outputs.pr_type }} PR that closes #${{ needs.select-issue.outputs.issue_number }}.
            Include a summary, list of changes, and test plan.
            Add footer: `Automated by repo-maintainer (${{ needs.select-issue.outputs.tier }})`

            If tests still fail after 2 attempts, create a draft PR explaining what failed.
          claude_args: '--model sonnet --allowedTools "Bash,Read,Write,Edit,Glob,Grep" --max-turns 100'

      - name: Get PR number from output
        id: get-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE="${{ needs.select-issue.outputs.issue_number }}"
          # Find open PRs with branch names starting with maintainer/issue-N
          PR=$(gh pr list --state open --json number,headRefName \
            --jq "[.[] | select(.headRefName | startswith(\"maintainer/issue-${ISSUE}\"))] | .[0].number // empty" \
            2>/dev/null || echo "")
          if [[ -n "$PR" ]]; then
            echo "pr_number=$PR" >> $GITHUB_OUTPUT
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo "pr_number=" >> $GITHUB_OUTPUT
            echo "result=failure" >> $GITHUB_OUTPUT
          fi

  # ── Job 4: Update State ───────────────────────────
  update-state:
    needs: [circuit-breaker, select-issue, implement]
    if: always() && needs.select-issue.outputs.issue_number != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update state
        run: |
          ISSUE="${{ needs.select-issue.outputs.issue_number }}"
          PR="${{ needs.implement.outputs.pr_number || '' }}"
          RESULT="${{ needs.implement.outputs.result || 'failure' }}"

          bash ${{ env.SCRIPTS_PATH }}/update-state.sh record-run \
            "$ISSUE" "${PR:-0}" "$RESULT" "1.00"

      - name: Commit state
        run: |
          git config user.name "repo-maintainer[bot]"
          git config user.email "repo-maintainer[bot]@users.noreply.github.com"
          git add ${{ env.STATE_PATH }}
          git diff --staged --quiet || git commit -m "chore(maintainer): update state after issue #${{ needs.select-issue.outputs.issue_number }}"
          git push origin main
