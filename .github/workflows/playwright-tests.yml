name: Playwright E2E Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - '.github/workflows/playwright-tests.yml'

  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'

  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Which test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - auth
          - projects
          - episodes
          - content
          - generation
          - navigation
          - responsive
          - performance
          - accessibility
          - integration

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # Reduced to 1 shard while E2E stability is fixed (see #94)
        shard: [1]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          BASE_URL: https://dev.podcaststudiohub.me
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Run specific test suite (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_suite != 'all' }}
        # TEST_SUITE is a dispatch input (arbitrary via the API) — read from env, never
        # interpolated into the shell. The surrounding globs stay unquoted on purpose.
        run: npx playwright test tests/e2e/specs/*"$TEST_SUITE"*.spec.ts
        env:
          TEST_SUITE: ${{ github.event.inputs.test_suite }}
          BASE_URL: https://dev.podcaststudiohub.me
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Run all tests (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_suite == 'all' }}
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          BASE_URL: https://dev.podcaststudiohub.me
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      # Restore real signal: a suite that silently skips its coverage must not
      # report green. Parses the JSON report and enforces a floor of really-run
      # tests plus a ceiling on skips. Runs even when tests fail so the counts
      # are always surfaced.
      - name: Enforce test signal (skip-count gate)
        if: ${{ always() && github.event_name != 'workflow_dispatch' }}
        run: |
          REPORT=playwright-report/results.json
          if [ ! -f "$REPORT" ]; then
            echo "::error::Playwright JSON report not found at $REPORT — cannot verify test signal."
            exit 1
          fi
          # Floor of real tests that must actually run + pass. Guards against the
          # historical false-green where 9/10 specs were fixme'd and CI still
          # exited 0. The auth suite (~15 tests) is the current active baseline;
          # raise this as the #337-blocked isolation/journey specs are un-fixme'd.
          MIN_PASSED=10
          # Ceiling on skipped tests. Observed baseline is 204 fixme'd tests
          # (first green run); 210 leaves a small buffer. Adding more skips must
          # be deliberate (bump this); as #337-blocked specs are un-fixme'd this
          # count drops, so the ceiling won't false-fail.
          MAX_SKIPPED=210
          PASSED=$(jq '.stats.expected // 0' "$REPORT")
          FAILED=$(jq '.stats.unexpected // 0' "$REPORT")
          FLAKY=$(jq '.stats.flaky // 0' "$REPORT")
          SKIPPED=$(jq '.stats.skipped // 0' "$REPORT")
          echo "::notice title=Playwright signal::passed=$PASSED failed=$FAILED flaky=$FLAKY skipped=$SKIPPED"
          STATUS=0
          if [ "$PASSED" -lt "$MIN_PASSED" ]; then
            echo "::error::Only $PASSED tests passed (min $MIN_PASSED). The suite is silently skipping real coverage."
            STATUS=1
          fi
          if [ "$SKIPPED" -gt "$MAX_SKIPPED" ]; then
            echo "::error::$SKIPPED tests skipped (max $MAX_SKIPPED). Re-enable coverage or justify the increase."
            STATUS=1
          fi
          exit $STATUS

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  merge-reports:
    name: Merge Test Reports
    if: always()
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download all reports
        uses: actions/download-artifact@v8
        with:
          path: all-reports/
          pattern: playwright-report-*

      - name: Merge reports
        run: npx playwright merge-reports --reporter=html ./all-reports
        continue-on-error: true

      - name: Upload merged report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-merged
          path: playwright-report/
          retention-days: 30

  notify:
    name: Notify Test Results
    if: always()
    needs: [test, merge-reports]
    runs-on: ubuntu-latest

    steps:
      - name: Check test status
        run: |
          if [ "${{ needs.test.result }}" == "failure" ]; then
            echo "Tests failed!"
            exit 1
          else
            echo "Tests passed!"
          fi
