name: Test Suite

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**/*.py'
      - 'apps/**/*.ts'
      - 'apps/**/*.tsx'
      - 'apps/**/*.js'
      - 'apps/**/*.jsx'
      - 'apps/api/pyproject.toml'
      - 'apps/api/uv.lock'
      - 'package-lock.json'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test-backend:
    name: Backend Tests (Python/FastAPI)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: podcastfy
          POSTGRES_PASSWORD: podcastfy_password
          POSTGRES_DB: podcastfy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # This job already pointed CELERY_BROKER_URL/RESULT_BACKEND at
      # redis://localhost:6379 while nothing listened there, so any test
      # touching real Redis silently exercised the connection-refused path.
      # /ready PINGs Redis for real (issue #320), so the broker the env vars
      # below already claim now actually runs.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync

      - name: Run database migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://podcastfy:podcastfy_password@localhost:5432/podcastfy
          ENCRYPTION_KEY: test-encryption-key-for-ci-00000
          JWT_SECRET_KEY: test-jwt-secret-for-ci
        run: uv run alembic upgrade head

      - name: Run pytest with coverage
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://podcastfy:podcastfy_password@localhost:5432/podcastfy
          SECRET_KEY: test-secret-key-for-ci
          ENCRYPTION_KEY: test-encryption-key-for-ci-00000
          # >=32 bytes: PyJWT warns on shorter HS256 keys (RFC 7518 §3.2) and
          # filterwarnings=error would fail the suite (#306).
          JWT_SECRET_KEY: test-jwt-secret-for-ci-0000000000
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          # Explicit rather than relying on the settings default, so the /ready
          # probe's PING target is visible next to the service that serves it.
          REDIS_URL: redis://localhost:6379/0
        run: |
          uv run pytest tests/ \
            --cov=src \
            --cov-report=xml:coverage/backend/coverage.xml \
            --cov-report=html:coverage/backend \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            -v

      - name: Upload backend coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: |
            apps/api/coverage/backend/
          retention-days: 30

      - name: Backend test summary
        if: always()
        run: |
          echo "### Backend Test Results 🐍" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Coverage reports uploaded as artifacts." >> $GITHUB_STEP_SUMMARY

  # The main backend job runs migrations as the Postgres superuser, so a
  # migration needing privileges the *real* migration user lacks passes CI but
  # breaks deploy. (This took dev down: 003's CREATE ROLE failed under the
  # non-CREATEROLE server role, leaving the schema 9 versions behind.) This job
  # mirrors the server's least-privilege model so that class of failure fails
  # the PR instead.
  #
  # It also locks in issue #301's two-role model: migrations run via a dedicated
  # MIGRATION_DATABASE_URL pointing at a privileged (BYPASSRLS) owner role, so
  # RLS-affected backfills (006/012) apply to all rows. The negative step proves
  # the fail-loud guard: running migrations under a non-BYPASSRLS owner must
  # error at the guarded backfill instead of silently no-oping.
  migrate-as-non-superuser:
    name: Migrations run under dev privilege model
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync

      - name: Provision dev-parity roles and databases
        env:
          PGPASSWORD: postgres
        run: |
          # Mirror the dev server's least-privilege model. The migration owner is
          # NOSUPERUSER/NOCREATEDB/NOCREATEROLE (migrations must not need those),
          # but carries BYPASSRLS so the documented two-role model (issue #301)
          # lets RLS-affected backfills apply to all rows. podcastfy_app is
          # provisioned out-of-band (as a DBA would). A second database owned by a
          # role WITHOUT BYPASSRLS exercises the fail-loud guard. Throwaway CI
          # credentials reuse the postgres/postgres service password (no secret).
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE podcastfy_user LOGIN PASSWORD 'postgres' NOSUPERUSER NOCREATEDB NOCREATEROLE BYPASSRLS;
          CREATE DATABASE podcastfy OWNER podcastfy_user;
          CREATE ROLE podcastfy_app LOGIN PASSWORD 'postgres' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          CREATE ROLE podcastfy_norls LOGIN PASSWORD 'postgres' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE DATABASE podcastfy_norls OWNER podcastfy_norls;
          SQL

      - name: Run migrations via the privileged MIGRATION_DATABASE_URL (must succeed)
        working-directory: apps/api
        env:
          # App connects as the non-privileged role; Alembic uses the privileged one.
          DATABASE_URL: postgresql+asyncpg://podcastfy_app:postgres@localhost:5432/podcastfy
          MIGRATION_DATABASE_URL: postgresql+asyncpg://podcastfy_user:postgres@localhost:5432/podcastfy
        run: |
          # config.py requires these at import; generate ephemeral values at
          # runtime so no secret-looking literal sits in the workflow file.
          # ENCRYPTION_KEY must be >=32 chars (config validator).
          export ENCRYPTION_KEY="$(printf 'x%.0s' {1..32})"
          export JWT_SECRET_KEY=ci
          uv run alembic upgrade head

      - name: Migrations under a non-BYPASSRLS role must fail loudly (issue #301)
        working-directory: apps/api
        env:
          # Owner role WITHOUT BYPASSRLS — backfills are RLS-subject and must error.
          MIGRATION_DATABASE_URL: postgresql+asyncpg://podcastfy_norls:postgres@localhost:5432/podcastfy_norls
          DATABASE_URL: postgresql+asyncpg://podcastfy_norls:postgres@localhost:5432/podcastfy_norls
        run: |
          export ENCRYPTION_KEY="$(printf 'x%.0s' {1..32})"
          export JWT_SECRET_KEY=ci
          set +e
          out="$(uv run alembic upgrade head 2>&1)"
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::Migrations succeeded under a non-BYPASSRLS role — the row_security guard is not working (issue #301)."
            exit 1
          fi
          # The failure must be the RLS guard, not an unrelated error.
          if ! echo "$out" | grep -qi "row.level security\|row_security"; then
            echo "::error::Migrations failed under the non-privileged role, but not via the row_security guard (issue #301)."
            exit 1
          fi
          echo "Confirmed: migrations failed loudly via the row-level-security guard (expected)."

  test-frontend:
    name: Frontend Tests (Next.js/Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run TypeScript type check
        working-directory: apps/web
        run: npm run typecheck

      - name: Run Jest with coverage
        working-directory: apps/web
        run: |
          npm run test:coverage -- \
            --passWithNoTests \
            --watchAll=false \
            --coverage \
            --coverageReporters=lcov \
            --coverageReporters=html \
            --coverageReporters=text \
            --coverageReporters=json-summary

      - name: Upload frontend coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: |
            apps/web/coverage/frontend/
          retention-days: 30

      - name: Frontend test summary
        if: always()
        run: |
          echo "### Frontend Test Results ⚛️" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Coverage reports uploaded as artifacts." >> $GITHUB_STEP_SUMMARY

  security-audit:
    name: Dependency Vulnerability Audit (pip-audit + npm audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: pip-audit over the locked backend closure
        working-directory: apps/api
        run: bash scripts/security-audit.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # npm workspace monorepo: root lockfile covers apps/web (#306).
      - name: npm audit (high+) over the workspace lockfile
        run: npm audit --audit-level=high

  test-deployment:
    name: Deployment Config Tests (nginx/TLS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      - name: Validate nginx config (spec + real nginx -t via Docker)
        run: python -m pytest deployment/tests/ -v

  aggregate-coverage:
    name: Aggregate Coverage Reports
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download backend coverage
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: apps/api/coverage/backend/

      - name: Download frontend coverage
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: apps/web/coverage/frontend/

      - name: Install jq (for JSON parsing)
        run: sudo apt-get update && sudo apt-get install -y jq bc

      - name: Run coverage aggregation
        run: bash scripts/aggregate-coverage.sh

      - name: Upload combined coverage report
        uses: actions/upload-artifact@v7
        with:
          name: combined-coverage-report
          path: coverage/combined-coverage-report.md
          retention-days: 30

      - name: Display combined coverage
        if: always()
        run: |
          echo "### 📊 Combined Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat coverage/combined-coverage-report.md >> $GITHUB_STEP_SUMMARY

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-deployment, security-audit]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "### 🎯 Quality Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.test-backend.result }}" != "success" ]; then
            echo "❌ Backend tests failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ Backend tests passed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.test-frontend.result }}" != "success" ]; then
            echo "❌ Frontend tests failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ Frontend tests passed" >> $GITHUB_STEP_SUMMARY
          fi

          # E2E is owned by playwright-tests.yml (PR-built stack, failing-capable) — see #341.

          if [ "${{ needs.security-audit.result }}" != "success" ]; then
            echo "❌ Dependency vulnerability audit failed (pip-audit / npm audit)" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ Dependency vulnerability audit passed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.test-deployment.result }}" != "success" ]; then
            echo "❌ Deployment config tests failed (nginx/TLS)" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ Deployment config tests passed (nginx/TLS)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🚀 All critical tests passed! Ready for deployment." >> $GITHUB_STEP_SUMMARY
