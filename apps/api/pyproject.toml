[project]
name = "api"
version = "0.1.0"
description = "Podcastfy GUI API - FastAPI backend for podcast generation platform"
readme = "README.md"
authors = [
    { name = "frankbria", email = "frank.bria@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "email-validator>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.12.0",
    "pyjwt>=2.10.1",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.6",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "boto3>=1.28.0",
    "python-dotenv>=1.0.0",
    "podcastfy==0.4.1",  # pinned: task kwargs are coupled to this signature (see #204); bumping needs a signature recheck
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "pytest-xdist>=3.5.0",
    "psycopg[binary]>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# podcastfy==0.4.1 caps these transitives (setuptools<76, wheel<0.45) below
# their CVE-fixed releases (PYSEC-2025-49, CVE-2026-24049). Overrides let the
# security-critical pins float independent of the podcastfy pin (#306).
override-dependencies = [
    "setuptools>=78.1.1",
    "wheel>=0.46.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.2",
]

[tool.ruff.lint]
# W605 (invalid escape sequence) backstops the module-agnostic SyntaxWarning
# ignore in pytest.ini: first-party invalid escapes fail lint, so the pytest
# filter only ever masks pydub's compile-time warning (#346).
extend-select = ["W605"]
