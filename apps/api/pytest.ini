[pytest]
# Test discovery patterns
testpaths = tests tests/unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async mode settings for pytest-asyncio
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Coverage configuration
addopts =
    --verbose
    --durations=10
    --strict-markers
    --cov=src
    --cov-report=html:coverage/backend
    --cov-report=term-missing
    --cov-report=xml:coverage/backend/coverage.xml
    --cov-fail-under=85

# Coverage run/report settings live in .coveragerc (coverage.py does not
# read [coverage:*] sections from pytest.ini).

# Markers for organizing tests
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Tests that take longer to run
    asyncio: Async tests

# Warning settings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
