name: Deploy to Development

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/src/**'
      - 'apps/api/alembic/**'
      - 'apps/api/pyproject.toml'
      - 'apps/api/uv.lock'
      - 'apps/web/src/**'
      - 'apps/web/public/**'
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
      - 'package-lock.json'
      - 'apps/web/next.config.mjs'
      - 'apps/web/tailwind.config.ts'
      - 'deployment/**'
      - '.github/workflows/deploy-dev.yml'

  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests before deployment'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: podcastfy
          POSTGRES_PASSWORD: podcastfy_password
          POSTGRES_DB: podcastfy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # This job runs the API suite too, so it needs the same broker test.yml
      # provisions: the env below already points CELERY_BROKER_URL at
      # redis://localhost:6379 while nothing listened there, and /ready PINGs
      # Redis for real (issue #320).
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Fail fast and itemised when the environment is not configured, rather
      # than dying several steps later on whichever secret happens to be read
      # first. Values are read from env, never interpolated into the script —
      # an expression inside a run block executes on the runner.
      - name: Preflight — development must actually be configured
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_PATH: ${{ vars.SERVER_PATH }}
          API_URL: ${{ vars.API_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
        run: |
          set -euo pipefail
          REQUIRED="SSH_PRIVATE_KEY SSH_KNOWN_HOSTS TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET
                    SERVER_USER NEXTAUTH_SECRET SERVER_HOST SERVER_PATH
                    API_URL FRONTEND_URL NEXTAUTH_URL"

          missing=""
          for name in $REQUIRED; do
            # Whitespace-only counts as missing: a secret set to " " is not set.
            value="${!name:-}"
            if [ -z "$(printf '%s' "$value" | tr -d '[:space:]')" ]; then
              missing="${missing} ${name}"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::The development environment is not configured."
            echo ""
            echo "Missing (or blank) secrets/variables:"
            for name in $missing; do echo "  - ${name}"; done
            echo ""
            echo "GitHub exposes environment secrets only to jobs declaring that"
            echo "environment. Set them with:"
            echo "  gh secret set <NAME> --env development"
            echo "  gh variable set <NAME> --env development"
            exit 1
          fi

          echo "✅ Development environment is configured."

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install API dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync

      - name: Run database migrations
        if: ${{ !inputs.skip_tests }}
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://podcastfy:podcastfy_password@localhost:5432/podcastfy
          ENCRYPTION_KEY: test-encryption-key-for-ci-00000
          JWT_SECRET_KEY: test-jwt-secret-for-ci-0000000000
        run: uv run alembic upgrade head

      - name: Run API tests
        if: ${{ !inputs.skip_tests }}
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://podcastfy:podcastfy_password@localhost:5432/podcastfy
          SECRET_KEY: test-secret-key-for-ci
          ENCRYPTION_KEY: test-encryption-key-for-ci-00000
          JWT_SECRET_KEY: test-jwt-secret-for-ci-0000000000
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          # Explicit rather than relying on the settings default, so the /ready
          # probe's PING target is visible next to the service that serves it.
          REDIS_URL: redis://localhost:6379/0
        run: |
          uv run pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            -v

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run frontend tests
        if: ${{ !inputs.skip_tests }}
        working-directory: apps/web
        run: |
          npm test -- \
            --passWithNoTests \
            --watchAll=false \
            --coverage \
            --coverageReporters=text

      - name: Build frontend
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
        run: npm run build

      # The VPS firewalls port 22 off the public internet (#441), so the runner
      # reaches it over Tailscale instead. vars.SERVER_HOST must therefore be
      # the box's tailnet MagicDNS name (or 100.x address), not the public IP.
      # Box side: join the tailnet and `ufw allow in on tailscale0 to any port 22`.
      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # The key is held by the agent for the life of the job and never written
      # to the runner's filesystem, so no on-disk copy can outlive a failed
      # cleanup step.
      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        # Pinned host key rather than a live ssh-keyscan: keyscan is TOFU (it
        # trusts whatever answers), and its repeated bursts tripped this box's
        # fail2ban and banned the runner. Populate the SSH_KNOWN_HOSTS secret
        # from a trusted session, having verified the fingerprint out-of-band:
        #   ssh-keyscan <host> | gh secret set SSH_KNOWN_HOSTS --env development
        # It must be labelled with the same host string as SERVER_HOST or it
        # will not verify.
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "${SSH_KNOWN_HOSTS}" ]; then
            echo "❌ SSH_KNOWN_HOSTS secret is not set — the deploy cannot verify the server host key."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KNOWN_HOSTS}" >> ~/.ssh/known_hosts

      - name: Configure PM2 log rotation
        env:
          SSH_HOST: ${{ vars.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
        run: |
          # PM2 captures stdout/stderr for all three processes into ~/.pm2/logs
          # and never rotates them (issue #320) — on a long-lived host they grow
          # until they fill the disk. pm2-logrotate is a *global* pm2 module
          # (not per-process), so it is configured once here, before the
          # API/frontend/celery processes start writing under it. There is no
          # ecosystem file to carry this config, hence `pm2 set`.
          # NOTE: no backticks anywhere below — this is an unquoted heredoc, so
          # the runner's shell command-substitutes backticks (even inside #
          # comments) before the text is ever sent to the server.
          ssh $SSH_USER@$SSH_HOST << EOF
            set -e

            # Idempotent: pm2 install on an already-installed module updates it
            # in place, and each pm2 set overwrites the stored value.
            pm2 install pm2-logrotate

            # Rotate at 10M per file, keep 7 compressed generations per process,
            # and force a daily roll at midnight even on quiet days so a file
            # can't sit unrotated for weeks.
            pm2 set pm2-logrotate:max_size 10M
            pm2 set pm2-logrotate:retain 7
            pm2 set pm2-logrotate:compress true
            pm2 set pm2-logrotate:rotateInterval '0 0 * * *'

            echo "PM2 log rotation configured"
          EOF

      - name: Deploy API
        env:
          SSH_HOST: ${{ vars.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ vars.SERVER_PATH }}
          API_PORT: ${{ vars.API_PORT }}
        run: |
          # Sync API source files to server
          rsync -avz -e ssh \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            --exclude='.venv' \
            apps/api/src/ \
            $SSH_USER@$SSH_HOST:$SERVER_PATH/api/src/

          # Sync API config files.
          # README.md is required: pyproject sets readme = "README.md" and the
          # hatchling build validates it exists, so `uv sync` on the server fails
          # with OSError on a from-scratch box if it isn't synced.
          rsync -avz -e ssh \
            apps/api/pyproject.toml \
            apps/api/uv.lock \
            apps/api/alembic.ini \
            apps/api/README.md \
            $SSH_USER@$SSH_HOST:$SERVER_PATH/api/

          # Sync migrations
          rsync -avz -e ssh \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            apps/api/alembic/ \
            $SSH_USER@$SSH_HOST:$SERVER_PATH/api/alembic/

          # Sync ONLY backup-db.sh — the one deployment/ asset this workflow runs
          # itself, as the non-root deploy account, in the pre-migration dump
          # below (issue #319; same path the #293 timer executes). The deploy
          # account both owns and runs it, so it running its own committed copy
          # is no escalation.
          #
          # Deliberately NOT the rest of deployment/. provision-ssl.sh,
          # harden-host.sh, install-db-backup-timer.sh, configure-redis-*.sh and
          # the nginx/logrotate assets are run (or installed) by an operator as
          # ROOT. Staging them in this deploy-account-writable tree and then
          # running them as root would let anyone who compromises the app account
          # (which runs as this same account) rewrite a script root later
          # executes — a privilege-escalation path. #209 hardened this box to run
          # deploys non-root precisely to avoid that. Root-run provisioning
          # therefore lives in a ROOT-OWNED clone the deploy account cannot write;
          # see deployment/README.md → "How the box gets deployment assets".
          #
          # mkdir -p first: rsync does not create intermediate remote dirs, and a
          # host deployed only by this workflow has no deployment/ tree yet.
          ssh $SSH_USER@$SSH_HOST \
            "mkdir -p $SERVER_PATH/deployment/scripts"
          rsync -avz -e ssh \
            deployment/scripts/backup-db.sh \
            $SSH_USER@$SSH_HOST:$SERVER_PATH/deployment/scripts/

          # Install dependencies and restart on server
          ssh $SSH_USER@$SSH_HOST << EOF
            # Fail fast: a failed migration or sync must abort the deploy before
            # the running API is torn down, rather than silently continuing.
            set -e
            cd $SERVER_PATH/api

            # Install uv if not already installed
            if ! command -v uv &> /dev/null; then
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="\$HOME/.cargo/bin:\$PATH"
            fi

            # Sync dependencies using uv (creates .venv automatically)
            uv sync

            # Pre-migration off-host dump (issue #319): gate the migration on a
            # fresh restore point. backup-db.sh hard-fails if the S3 bucket or
            # creds are missing or the dump comes out empty, and set -e above
            # aborts the deploy BEFORE the live schema is touched. The
            # pre-migration/ prefix keeps these dumps distinguishable from the
            # nightly ones and is pruned by the script's own retention window.
            # The app .env supplies DATABASE_URL / AWS_* (values must stay
            # shell-sourceable — see deployment/README.md).
            set -a
            . ./.env
            set +a
            DB_BACKUP_S3_PREFIX="db-backups/pre-migration/" \
              bash $SERVER_PATH/deployment/scripts/backup-db.sh

            # Run database migrations
            uv run alembic upgrade head

            # Clear Python bytecode cache to ensure new code is loaded
            find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
            find . -type f -name '*.pyc' -delete 2>/dev/null || true

            # The API port is per-environment: this is a multi-tenant host, so the
            # port that nginx proxies to differs per app (dev podcast = 8005, the
            # committed default in deployment/nginx/podcastfy.conf). The source of
            # truth is the environment's API_PORT variable, which must match that
            # environment's nginx upstream. Require it to be set and numeric so a
            # missing/typo'd value fails fast BEFORE the running service is torn
            # down, rather than silently binding a port nginx doesn't proxy.
            API_EFFECTIVE_PORT="${API_PORT}"
            case "\$API_EFFECTIVE_PORT" in
              ''|*[!0-9]*)
                echo "API_PORT must be set to the numeric port matching this environment's nginx upstream (got: '\$API_EFFECTIVE_PORT')" >&2
                exit 1
                ;;
            esac

            # Restart API service (delete and recreate to ensure fresh start)
            if pm2 describe podcaststudiohub-api > /dev/null 2>&1; then
              echo "Stopping existing API service..."
              pm2 delete podcaststudiohub-api
            fi

            echo "Starting API service on port \$API_EFFECTIVE_PORT..."
            EMAIL_ENABLED=false \
            REQUIRE_EMAIL_VERIFICATION=false \
            RATE_LIMIT_ENABLED=false \
            BILLING_ENFORCEMENT_ENABLED=false \
            pm2 start uv \
              --name podcaststudiohub-api \
              --cwd $SERVER_PATH/api \
              -- run --no-sync uvicorn src.main:app --host 127.0.0.1 --port "\$API_EFFECTIVE_PORT"

            pm2 save

            echo "API deployment complete"
          EOF

      - name: Deploy Frontend
        env:
          SSH_HOST: ${{ vars.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ vars.SERVER_PATH }}
          API_URL: ${{ vars.API_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}
        run: |
          # Sync public files to server
          rsync -avz -e ssh \
            apps/web/public/ \
            $SSH_USER@$SSH_HOST:$SERVER_PATH/frontend/public/

          # Sync source files (needed for Next.js server-side rendering)
          rsync -avz -e ssh \
            apps/web/src/ \
            $SSH_USER@$SSH_HOST:$SERVER_PATH/frontend/src/

          # Sync package files and config
          rsync -avz -e ssh \
            apps/web/package.json \
            apps/web/next.config.mjs \
            apps/web/tsconfig.json \
            apps/web/tailwind.config.ts \
            apps/web/postcss.config.mjs \
            $SSH_USER@$SSH_HOST:$SERVER_PATH/frontend/

          # Install dependencies on server
          # Uses npm install (not npm ci) because the VPS has only the frontend
          # directory, not the full monorepo. The workspace-scoped lockfile at
          # the repo root can't be used in isolation.
          ssh $SSH_USER@$SSH_HOST "cd $SERVER_PATH/frontend && npm install"

          # Create .env.production with runtime environment variables (needed for build)
          ssh $SSH_USER@$SSH_HOST "echo 'NEXT_PUBLIC_API_URL=$API_URL' > $SERVER_PATH/frontend/.env.production"
          ssh $SSH_USER@$SSH_HOST "echo 'NEXTAUTH_SECRET=$NEXTAUTH_SECRET' >> $SERVER_PATH/frontend/.env.production"
          ssh $SSH_USER@$SSH_HOST "echo 'NEXTAUTH_URL=$NEXTAUTH_URL' >> $SERVER_PATH/frontend/.env.production"
          ssh $SSH_USER@$SSH_HOST "echo 'PORT=${FRONTEND_PORT:-3000}' >> $SERVER_PATH/frontend/.env.production"
          # Restrict the secrets file so only the deploy user can read it.
          ssh $SSH_USER@$SSH_HOST "chmod 600 $SERVER_PATH/frontend/.env.production"
          echo "Runtime environment variables configured"

          # Rebuild Next.js on server with server's node_modules
          ssh $SSH_USER@$SSH_HOST "cd $SERVER_PATH/frontend && npm run build"

          # Update runtime config on server
          ssh $SSH_USER@$SSH_HOST "echo \"window.__ENV__ = { API_URL: '$API_URL' };\" > $SERVER_PATH/frontend/public/config.js"

          # Restart frontend service (delete and recreate to ensure fresh start)
          ssh $SSH_USER@$SSH_HOST << EOF
            cd $SERVER_PATH/frontend

            if pm2 describe podcaststudiohub-frontend > /dev/null 2>&1; then
              echo "Stopping existing frontend service..."
              pm2 delete podcaststudiohub-frontend
            fi

            echo "Starting frontend service on port ${FRONTEND_PORT:-3000}..."
            # NEXTAUTH_SECRET is intentionally NOT passed on the command line (it would
            # be visible via ps/proc). Next.js loads it from .env.production at runtime.
            PORT=${FRONTEND_PORT:-3000} \
            NEXT_PUBLIC_API_URL='$API_URL' \
            NEXTAUTH_URL='$NEXTAUTH_URL' \
            pm2 start npm \
              --name podcaststudiohub-frontend \
              --cwd $SERVER_PATH/frontend \
              -- start

            pm2 save

            echo "Frontend deployment complete"
          EOF

      - name: Restart Celery
        env:
          SSH_HOST: ${{ vars.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ vars.SERVER_PATH }}
        run: |
          ssh $SSH_USER@$SSH_HOST << EOF
            cd $SERVER_PATH/api

            if pm2 describe podcaststudiohub-celery > /dev/null 2>&1; then
              echo "Stopping existing Celery service..."
              pm2 delete podcaststudiohub-celery
            fi

            echo "Starting Celery worker..."
            # -B runs beat embedded in this single worker process: no separate
            # deployment starts a standalone beat process, so without it
            # nothing schedules reap_stuck_episodes or drain_storage_deletion_outbox
            # (issue #366). Only safe with exactly one worker process — running
            # -B on more than one would double-schedule every beat task.
            pm2 start uv \
              --name podcaststudiohub-celery \
              --cwd $SERVER_PATH/api \
              -- run --no-sync celery -A src.worker:celery_app worker -B --loglevel=info

            pm2 save

            echo "Celery deployment complete"
          EOF

      - name: Health Check
        env:
          API_URL: ${{ vars.API_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          # Poll instead of a single shot: a cold uvicorn start (importing the
          # podcastfy engine) routinely takes longer than a fixed sleep, so a
          # one-shot curl races the upstream coming up and nginx returns 502.
          # Retry with backoff and only fail if the service never becomes healthy.
          wait_for() {
            local name="$1" url="$2" want="$3"
            local attempts=30 status
            for i in $(seq 1 "$attempts"); do
              status=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo "000")
              if [ "$status" = "$want" ]; then
                echo "✓ $name health check passed (after ${i} attempt(s))"
                return 0
              fi
              echo "$name not ready (status: $status), retry $i/$attempts..."
              sleep 5
            done
            echo "$name health check failed; last status: $status"
            return 1
          }

          # Gate on /ready, NOT /health (issue #320). /health is a liveness
          # probe: it returns 200 as soon as the uvicorn process is answering,
          # so a deploy goes green even when Postgres or Redis is unreachable
          # and every real request 500s. /ready is the readiness probe — it
          # checks those dependencies and returns 503 until they are reachable,
          # so it fails the deploy on exactly the states /health hides.
          wait_for "API" "$API_URL/ready" "200" || exit 1
          wait_for "Frontend" "$FRONTEND_URL" "200" || exit 1

          echo "🚀 Deployment successful!"
