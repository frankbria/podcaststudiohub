[project]
name = "api"
version = "0.1.0"
description = "Podcastfy GUI API - FastAPI backend for podcast generation platform"
readme = "README.md"
authors = [
    { name = "frankbria", email = "frank.bria@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.15.0",
    "email-validator>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.29.0",
    "alembic>=1.19.1",
    "pyjwt>=2.10.1",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.6",
    "celery>=5.3.0",
    "redis>=8.1.0",
    "boto3>=1.43.67",
    "python-dotenv>=1.0.0",
    "podcastfy==0.4.1",  # pinned: task kwargs are coupled to this signature (see #204); bumping needs a signature recheck
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "pytest-xdist>=3.5.0",
    "psycopg[binary]>=3.3.4",
    "sentry-sdk>=2.67.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# podcastfy==0.4.1 caps these transitives (setuptools<76, wheel<0.45) below
# their CVE-fixed releases (PYSEC-2025-49, CVE-2026-24049). Overrides let the
# security-critical pins float independent of the podcastfy pin (#306).
override-dependencies = [
    "setuptools>=78.1.1",
    "wheel>=0.46.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]

[tool.ruff.lint]
# Pinned explicitly rather than inherited. Ruff's *default* selection widens
# between releases -- 0.16 added I, UP, B, SIM, RUF, DTZ, RET and BLE, which
# took this tree from 1 finding to 1387 (#472). With CI running ruff, an
# unpinned default set means a routine Dependabot bump can redefine what
# "lint passes" means. Adopting further rules is now a deliberate edit here.
# Of the substantive rules 0.16 surfaced (tracked in #482): ASYNC230 and
# PLW1510 were adopted in #486, BLE001 in #488. DTZ is deliberately NOT
# adopted -- naive datetimes here are schema-tied (asyncpg rejects aware values
# for those columns, #346), so it would mean ~25 noqas and invite a "fix" that
# breaks inserts.
select = [
    "E4", "E7", "E9", "F",
    # Adopted from ruff 0.16's widened default set (#482). All are correctness
    # rules with a concrete failure mode, not style:
    #   ASYNC230 - a blocking open() inside `async def` stalls the whole event
    #              loop, i.e. every other in-flight request (same class as #321).
    #   PLW1510  - subprocess.run without an explicit `check` silently ignores a
    #              non-zero exit unless the caller remembers to inspect it.
    #   BLE001  - `except Exception` that hides a real error. Adopted in #488
    #              after classifying all 62 sites: one narrowing (idempotency's
    #              fail-open swallowed the ValueError from a malformed
    #              REDIS_URL, silently disabling the paid-work guard) and 61
    #              boundary catches, each carrying a `# noqa: BLE001` whose
    #              reason says why ANY exception maps to one outcome there. A
    #              bare suppression is not acceptable -- if you cannot state the
    #              reason, the catch is the bug.
    "ASYNC230", "PLW1510", "BLE001",
]
# W605 (invalid escape sequence) backstops the module-agnostic SyntaxWarning
# ignore in pytest.ini: first-party invalid escapes fail lint, so the pytest
# filter only ever masks pydub's compile-time warning (#346).
extend-select = ["W605"]
