name: Deploy to Development

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/src/**'
      - 'apps/api/alembic/**'
      - 'apps/api/pyproject.toml'
      - 'apps/api/uv.lock'
      - 'apps/web/src/**'
      - 'apps/web/public/**'
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
      - 'apps/web/next.config.mjs'
      - 'apps/web/tailwind.config.ts'
      - 'deployment/**'
      - '.github/workflows/deploy-dev.yml'

  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests before deployment'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: podcastfy
          POSTGRES_PASSWORD: podcastfy_password
          POSTGRES_DB: podcastfy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install API dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync

      - name: Run database migrations
        if: ${{ !inputs.skip_tests }}
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://podcastfy:podcastfy_password@localhost:5432/podcastfy
          ENCRYPTION_KEY: test-encryption-key-for-ci-0000
          JWT_SECRET_KEY: test-jwt-secret-for-ci
        run: uv run alembic upgrade head

      - name: Run API tests
        if: ${{ !inputs.skip_tests }}
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://podcastfy:podcastfy_password@localhost:5432/podcastfy
          SECRET_KEY: test-secret-key-for-ci
          ENCRYPTION_KEY: test-encryption-key-for-ci-0000
          JWT_SECRET_KEY: test-jwt-secret-for-ci
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        run: |
          uv run pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=0 \
            -v

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run frontend tests
        if: ${{ !inputs.skip_tests }}
        working-directory: apps/web
        run: |
          npm test -- \
            --passWithNoTests \
            --watchAll=false \
            --coverage \
            --coverageReporters=text

      - name: Build frontend
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
        run: npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ vars.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts

      - name: Deploy API
        env:
          SSH_HOST: ${{ vars.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ vars.SERVER_PATH }}
          API_PORT: ${{ vars.API_PORT }}
        run: |
          # Sync API source files to server
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            --exclude='.venv' \
            apps/api/src/ \
            $SSH_USER@$SSH_HOST:$SERVER_PATH/api/src/

          # Sync API config files
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            apps/api/pyproject.toml \
            apps/api/uv.lock \
            apps/api/alembic.ini \
            $SSH_USER@$SSH_HOST:$SERVER_PATH/api/

          # Sync migrations
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            apps/api/alembic/ \
            $SSH_USER@$SSH_HOST:$SERVER_PATH/api/alembic/

          # Install dependencies and restart on server
          ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST << EOF
            cd $SERVER_PATH/api

            # Install uv if not already installed
            if ! command -v uv &> /dev/null; then
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="\$HOME/.cargo/bin:\$PATH"
            fi

            # Sync dependencies using uv (creates .venv automatically)
            uv sync

            # Run database migrations
            uv run alembic upgrade head

            # Clear Python bytecode cache to ensure new code is loaded
            find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
            find . -type f -name '*.pyc' -delete 2>/dev/null || true

            # Restart API service (delete and recreate to ensure fresh start)
            if pm2 describe podcaststudiohub-api > /dev/null 2>&1; then
              echo "Stopping existing API service..."
              pm2 delete podcaststudiohub-api
            fi

            echo "Starting API service on port ${API_PORT:-8000}..."
            pm2 start uv \
              --name podcaststudiohub-api \
              --cwd $SERVER_PATH/api \
              -- run uvicorn src.main:app --host 0.0.0.0 --port ${API_PORT:-8000}

            pm2 save

            echo "API deployment complete"
          EOF

      - name: Deploy Frontend
        env:
          SSH_HOST: ${{ vars.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ vars.SERVER_PATH }}
          API_URL: ${{ vars.API_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}
        run: |
          # Sync public files to server
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            apps/web/public/ \
            $SSH_USER@$SSH_HOST:$SERVER_PATH/frontend/public/

          # Sync source files (needed for Next.js server-side rendering)
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            apps/web/src/ \
            $SSH_USER@$SSH_HOST:$SERVER_PATH/frontend/src/

          # Sync package files and config
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            apps/web/package.json \
            apps/web/next.config.mjs \
            apps/web/tsconfig.json \
            apps/web/tailwind.config.ts \
            apps/web/postcss.config.mjs \
            $SSH_USER@$SSH_HOST:$SERVER_PATH/frontend/

          # Install dependencies on server
          # Uses npm install (not npm ci) because the VPS has only the frontend
          # directory, not the full monorepo. The workspace-scoped lockfile at
          # the repo root can't be used in isolation.
          ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST "cd $SERVER_PATH/frontend && npm install"

          # Create .env.production with runtime environment variables (needed for build)
          ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST "echo 'NEXT_PUBLIC_API_URL=$API_URL' > $SERVER_PATH/frontend/.env.production"
          ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST "echo 'NEXTAUTH_SECRET=$NEXTAUTH_SECRET' >> $SERVER_PATH/frontend/.env.production"
          ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST "echo 'NEXTAUTH_URL=$NEXTAUTH_URL' >> $SERVER_PATH/frontend/.env.production"
          ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST "echo 'PORT=${FRONTEND_PORT:-3000}' >> $SERVER_PATH/frontend/.env.production"
          echo "Runtime environment variables configured"

          # Rebuild Next.js on server with server's node_modules
          ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST "cd $SERVER_PATH/frontend && npm run build"

          # Update runtime config on server
          ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST "echo \"window.__ENV__ = { API_URL: '$API_URL' };\" > $SERVER_PATH/frontend/public/config.js"

          # Restart frontend service (delete and recreate to ensure fresh start)
          ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST << EOF
            cd $SERVER_PATH/frontend
            
            if pm2 describe podcaststudiohub-frontend > /dev/null 2>&1; then
              echo "Stopping existing frontend service..."
              pm2 delete podcaststudiohub-frontend
            fi
            
            echo "Starting frontend service on port ${FRONTEND_PORT:-3000}..."
            PORT=${FRONTEND_PORT:-3000} \
            NEXT_PUBLIC_API_URL='$API_URL' \
            NEXTAUTH_SECRET='$NEXTAUTH_SECRET' \
            NEXTAUTH_URL='$NEXTAUTH_URL' \
            pm2 start npm \
              --name podcaststudiohub-frontend \
              --cwd $SERVER_PATH/frontend \
              -- start
            
            pm2 save
            
            echo "Frontend deployment complete"
          EOF

      - name: Restart Celery
        env:
          SSH_HOST: ${{ vars.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ vars.SERVER_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST << EOF
            cd $SERVER_PATH/api
            
            if pm2 describe podcaststudiohub-celery > /dev/null 2>&1; then
              echo "Stopping existing Celery service..."
              pm2 delete podcaststudiohub-celery
            fi

            echo "Starting Celery worker..."
            pm2 start uv \
              --name podcaststudiohub-celery \
              --cwd $SERVER_PATH/api \
              -- run celery -A src.worker:celery_app worker --loglevel=info

            pm2 save

            echo "Celery deployment complete"
          EOF

      - name: Health Check
        env:
          API_URL: ${{ vars.API_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          echo "Waiting for services to start..."
          sleep 10

          # Check API health
          API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" $API_URL/health)
          if [ "$API_STATUS" != "200" ]; then
            echo "API health check failed with status: $API_STATUS"
            exit 1
          fi
          echo "✓ API health check passed"

          # Check frontend
          FRONTEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" $FRONTEND_URL)
          if [ "$FRONTEND_STATUS" != "200" ]; then
            echo "Frontend health check failed with status: $FRONTEND_STATUS"
            exit 1
          fi
          echo "✓ Frontend health check passed"

          echo "🚀 Deployment successful!"

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
