name: Test Suite

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**/*.py'
      - 'apps/**/*.ts'
      - 'apps/**/*.tsx'
      - 'apps/**/*.js'
      - 'apps/**/*.jsx'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test-backend:
    name: Backend Tests (Python/FastAPI)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: podcastfy
          POSTGRES_PASSWORD: podcastfy_password
          POSTGRES_DB: podcastfy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync

      - name: Run database migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://podcastfy:podcastfy_password@localhost:5432/podcastfy
          ENCRYPTION_KEY: test-encryption-key-for-ci-00000
          JWT_SECRET_KEY: test-jwt-secret-for-ci
        run: uv run alembic upgrade head

      - name: Run pytest with coverage
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://podcastfy:podcastfy_password@localhost:5432/podcastfy
          SECRET_KEY: test-secret-key-for-ci
          ENCRYPTION_KEY: test-encryption-key-for-ci-00000
          JWT_SECRET_KEY: test-jwt-secret-for-ci
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        run: |
          uv run pytest tests/ \
            --cov=src \
            --cov-report=xml:coverage/backend/coverage.xml \
            --cov-report=html:coverage/backend \
            --cov-report=term-missing \
            --cov-fail-under=0 \
            -v

      - name: Upload backend coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: |
            apps/api/coverage/backend/
          retention-days: 30

      - name: Backend test summary
        if: always()
        run: |
          echo "### Backend Test Results 🐍" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Coverage reports uploaded as artifacts." >> $GITHUB_STEP_SUMMARY

  test-frontend:
    name: Frontend Tests (Next.js/Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run Jest with coverage
        working-directory: apps/web
        run: |
          npm run test:coverage -- \
            --passWithNoTests \
            --watchAll=false \
            --coverage \
            --coverageReporters=lcov \
            --coverageReporters=html \
            --coverageReporters=text \
            --coverageReporters=json-summary

      - name: Upload frontend coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: |
            apps/web/coverage/frontend/
          retention-days: 30

      - name: Frontend test summary
        if: always()
        run: |
          echo "### Frontend Test Results ⚛️" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Coverage reports uploaded as artifacts." >> $GITHUB_STEP_SUMMARY

  test-e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: apps/web
        env:
          BASE_URL: https://dev.podcaststudiohub.me
          API_URL: https://dev.podcaststudiohub.me/api
        run: npm run test:e2e
        continue-on-error: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 30

      - name: E2E test summary
        if: always()
        run: |
          echo "### E2E Test Results 🎭" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Playwright reports uploaded as artifacts." >> $GITHUB_STEP_SUMMARY

  test-deployment:
    name: Deployment Config Tests (nginx/TLS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      - name: Validate nginx config (spec + real nginx -t via Docker)
        run: python -m pytest deployment/tests/ -v

  aggregate-coverage:
    name: Aggregate Coverage Reports
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: apps/api/coverage/backend/

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: apps/web/coverage/frontend/

      - name: Install jq (for JSON parsing)
        run: sudo apt-get update && sudo apt-get install -y jq bc

      - name: Run coverage aggregation
        run: bash scripts/aggregate-coverage.sh

      - name: Upload combined coverage report
        uses: actions/upload-artifact@v4
        with:
          name: combined-coverage-report
          path: coverage/combined-coverage-report.md
          retention-days: 30

      - name: Display combined coverage
        if: always()
        run: |
          echo "### 📊 Combined Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat coverage/combined-coverage-report.md >> $GITHUB_STEP_SUMMARY

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-e2e, test-deployment]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "### 🎯 Quality Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.test-backend.result }}" != "success" ]; then
            echo "❌ Backend tests failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ Backend tests passed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.test-frontend.result }}" != "success" ]; then
            echo "❌ Frontend tests failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ Frontend tests passed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.test-e2e.result }}" == "success" ]; then
            echo "✅ E2E tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️  E2E tests had issues (non-blocking)" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.test-deployment.result }}" != "success" ]; then
            echo "❌ Deployment config tests failed (nginx/TLS)" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ Deployment config tests passed (nginx/TLS)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🚀 All critical tests passed! Ready for deployment." >> $GITHUB_STEP_SUMMARY
